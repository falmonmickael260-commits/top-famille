<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!--
      gradientUnits="userSpaceOnUse" : le degrade par defaut se calcule sur
      la boite englobante DE CHAQUE FORME. Le trait vertical du micro a une
      largeur de boite nulle et la barre du socle une hauteur nulle - un
      degrade en boite englobante y est degenere et ne peint rien (le micro
      perdait son pied et son socle, silencieusement, dans tout moteur SVG
      qui applique la regle a la lettre). En coordonnees absolues, le
      degrade reste bien defini quelle que soit la forme qui l'utilise.
    -->
    <linearGradient id="g" x1="14" y1="9" x2="46" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.5" stop-color="#f5c344"/>
      <stop offset="1" stop-color="#b8860a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#060b1c"/>
  <rect x="4" y="4" width="56" height="56" rx="11" fill="none" stroke="#2f7bff" stroke-opacity="0.45" stroke-width="1.5"/>
  <circle cx="32" cy="24" r="11" fill="none" stroke="url(#g)" stroke-width="3.5"/>
  <path d="M32 35v9" stroke="url(#g)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M18 52h28" stroke="url(#g)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="32" cy="24" r="4" fill="#ff3b5c"/>
</svg>
